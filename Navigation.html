<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
:root {
  --bg: #0f1115;
  --panel: #161a22;
  --text: #e6e7ea;
  --accent: #ff005c;
  --font: "Inter", "Roboto", sans-serif;
}
body {margin:0;background:var(--bg);color:var(--text);font-family:var(--font);height:100vh;display:flex;flex-direction:column;}
header {background:var(--panel);text-align:center;padding:0.6em 0.5em;position:sticky;top:0;z-index:100;}
h1{font-size:1.2rem;margin:0.2em 0;color:var(--accent);}
nav{display:flex;justify-content:center;gap:1em;margin-top:0.3em;}
button{background:none;border:none;color:var(--text);font-size:1rem;padding:0.3em 0.5em;border-bottom:2px solid transparent;cursor:pointer;}
button.active{border-bottom-color:var(--accent);}
main{flex-grow:1;display:flex;flex-direction:column;position:relative;overflow:hidden;}
iframe,#scheduleSection{flex-grow:1;width:100%;border:none;background:var(--bg);}
.hidden{display:none;}
#scheduleSection{overflow-y:auto;padding-bottom:3em;}
.event{padding:1em;border-bottom:1px solid #222;cursor:pointer;transition:background 0.2s;}
.event:hover{background:#1b1f29;}
.event-time{color:var(--accent);font-weight:bold;}
.event-title{margin-top:0.3em;}
.event-stage{font-size:0.85rem;color:#aaa;}
.day{padding:0.8em 1em;font-weight:bold;background:#161a22;border-top:1px solid #222;color:var(--accent);}
#detailView{position:absolute;top:0;left:100%;width:100%;height:100%;background:var(--bg);display:flex;flex-direction:column;transition:left 0.3s ease-in-out;z-index:200;overflow-y:auto;}
#detailView.active{left:0;}
#detailImage{width:100%;max-height:40vh;object-fit:cover;}
#detailContent{padding:1em;}
#backBtn{background:var(--accent);color:white;border:none;padding:0.6em 1em;margin:1em;border-radius:4px;align-self:flex-start;cursor:pointer;}
</style>
</head>
<body>
<header>
  <nav>
    <button id="mapBtn" class="active">Map</button>
    <button id="scheduleBtn">Schedule</button>
  </nav>
</header>
<main>
  <iframe id="mapFrame" src="https://sgtdicks.github.io/GhMX/" allowfullscreen></iframe>
  <section id="scheduleSection" class="hidden"><div id="loading" style="text-align:center;padding:1em;">Loading schedule...</div></section>
  <section id="detailView">
    <button id="backBtn">← Back</button>
    <img id="detailImage" src="" alt="Event Image" />
    <div id="detailContent"></div>
  </section>
</main>
<script>
const mapBtn=document.getElementById("mapBtn"),scheduleBtn=document.getElementById("scheduleBtn"),mapFrame=document.getElementById("mapFrame"),scheduleSection=document.getElementById("scheduleSection"),loading=document.getElementById("loading"),detailView=document.getElementById("detailView"),detailImage=document.getElementById("detailImage"),detailContent=document.getElementById("detailContent"),backBtn=document.getElementById("backBtn");
mapBtn.onclick=()=>{mapBtn.classList.add("active");scheduleBtn.classList.remove("active");mapFrame.classList.remove("hidden");scheduleSection.classList.add("hidden");};
scheduleBtn.onclick=()=>{scheduleBtn.classList.add("active");mapBtn.classList.remove("active");mapFrame.classList.add("hidden");scheduleSection.classList.remove("hidden");};

const possiblePaths = ["schedule.json", "./schedule.json", "/schedule.json", "../schedule.json", "https://raw.githubusercontent.com/SgtDicks/GhMX/refs/heads/main/schedule.json"];
function tryFetch(paths) {
  if (!paths.length) {
    loading.textContent = "Schedule not available.";
    return;
  }
  const path = paths.shift();
  fetch(path)
    .then(r => {
      if (!r.ok) throw new Error("Not found");
      return r.json();
    })
    .then(data => renderSchedule(data))
    .catch(() => tryFetch(paths));
}
tryFetch([...possiblePaths]);

function renderSchedule(data){loading.remove();let html="";data.forEach(day=>{html+=`<div class='day'>${day.day}</div>`;day.events.forEach(e=>{html+=`<div class='event' data-title='${e.title}' data-desc='${e.description||""}' data-img='${e.image||""}'><div class='event-time'>${e.time}</div><div class='event-title'>${e.title}</div><div class='event-stage'>${e.stage}</div></div>`;});});scheduleSection.innerHTML=html;document.querySelectorAll('.event').forEach(ev=>{ev.addEventListener('click',()=>{openDetail(ev.dataset);});});}
function openDetail(d){detailImage.src=d.img||'';detailImage.style.display=d.img?'block':'none';detailContent.innerHTML=`<h2>${d.title}</h2><p>${d.desc}</p>`;detailView.classList.add('active');}
backBtn.onclick=()=>{detailView.classList.remove('active');};
</script>
</body>
</html>
